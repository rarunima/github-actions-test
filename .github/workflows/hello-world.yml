name: Hello World Workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    env:
      NEW_VAR: job_variable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Say Hello
        run: echo "Hello, World!"
      - name: variables
        run: echo "${{ github.ref }}"
      - name: test1
        run: echo "${{ env.NEW_VAR }}"
